[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chemfit-benchmarks"
version = "0.1.0"
description = "Standalone HPC scheduling scalability benchmarks for ChemFit 4"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "chemfit",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
mpi = ["mpi4py>=3.1"]
plot = ["matplotlib>=3.7"]
test = ["pytest>=8"]
all = ["mpi4py>=3.1", "matplotlib>=3.7", "pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 100
target-version = "py310"
