schema_version = 1
result_directory = "results"

[defaults]
backend = "mpi"
task_kind = "sleep"
task_duration = 0.01
components = 32
evaluations = 32
batch_size = 32
workers = [1, 3, 7]
repeats = 5
warmup_evaluations = 2
graph_depth = 1

[[benchmark]]
name = "mpi-strong-scaling"

[[benchmark]]
name = "mpi-throughput"
components = 1
evaluations = 128
batch_size = 128
task_duration = [0.001, 0.01, 0.1]

[[benchmark]]
name = "mpi-independent-components"
components = 32
evaluations = 1
batch_size = 1

[[benchmark]]
name = "mpi-batched-evaluations"
components = 1
evaluations = 32
batch_size = 32

[[benchmark]]
name = "mpi-deep-layered-graph"
components = 8
graph_depth = [2, 4]
evaluations = 16
batch_size = 16
task_duration = 0.001
